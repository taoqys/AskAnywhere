name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/AskAnywhere/AskAnywhere.csproj

      - name: Build
        run: dotnet build src/AskAnywhere/AskAnywhere.csproj -c Release --no-restore

      - name: Publish single-file
        run: dotnet publish src/AskAnywhere/AskAnywhere.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishReadyToRun=true -o publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AskAnywhere-win-x64
          path: publish/
          if-no-files-found: error
